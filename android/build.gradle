// PLAUD Laurent — module de l'application (copié en app/build.gradle par .github/workflows/apk.yml)
plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'fr.brasselet.plaud'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.brasselet.plaud'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.3.' + (System.getenv('VERSION_CODE') ?: '0')
    }

    // Clé de signature fixe : permet d'installer les nouvelles versions par-dessus l'ancienne
    // sans perdre l'historique enregistré sur le téléphone. La clé n'est jamais dans le dépôt :
    // GitHub la fournit au moment de la compilation (secret PLAUD_KEYSTORE_B64, voir apk.yml).
    signingConfigs {
        plaud {
            storeFile file('plaud.p12')
            storePassword System.getenv('PLAUD_KEY_PASSWORD')
            keyAlias 'plaud'
            keyPassword System.getenv('PLAUD_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.plaud
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
