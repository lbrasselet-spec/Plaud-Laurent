# PLAUD Laurent — fabrication automatique de l'application Android (APK).
# À chaque modification de index.html ou du dossier android/, GitHub compile l'application,
# la signe avec la clé du projet et la publie à l'adresse :
# https://github.com/lbrasselet-spec/Plaud-Laurent/releases/download/apk/PLAUD-Laurent.apk
# La clé de signature n'est pas dans le dépôt : elle est enregistrée dans le secret GitHub
# PLAUD_KEYSTORE_B64 (Settings > Secrets and variables > Actions). Sans ce secret, l'APK est
# signé avec une clé provisoire et n'est PAS publié (version de contrôle uniquement).
# v1.5 — L'APK contient aussi Whisper (transcription sur le téléphone) : les sources de
# whisper.cpp (version figée) et le petit modèle de détection de la parole sont téléchargés ici.
name: Application Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'icon-192.png', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assembler le projet Android
        shell: bash
        run: |
          P=projet
          J=$P/app/src/main/java/fr/brasselet/plaud
          mkdir -p $J $P/app/src/main/assets/www $P/app/src/main/cpp $P/app/src/main/res/mipmap-xxxhdpi
          cp android/settings.gradle $P/
          cp android/build.gradle $P/app/
          cp android/AndroidManifest.xml $P/app/src/main/
          cp android/*.java $J/
          # v1.5 — Whisper : pont JNI, sources whisper.cpp, modèle de détection de la parole
          cp android/jni/* $P/app/src/main/cpp/
          git -c advice.detachedHead=false clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git $P/whisper.cpp
          curl -sSfL --retry 3 -o $P/app/src/main/assets/ggml-silero-v6.2.0.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
          cp index.html icon-192.png $P/app/src/main/assets/www/
          cp icon-192.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          printf 'org.gradle.jvmargs=-Xmx3g\n' > $P/gradle.properties

      - name: Outils de compilation native (NDK, CMake)
        shell: bash
        run: |
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$S" --licenses > /dev/null || true
          "$S" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Clé de signature
        shell: bash
        env:
          CLE: ${{ secrets.PLAUD_KEYSTORE_B64 }}
        run: |
          if [ -n "$CLE" ]; then
            printf '%s' "$CLE" | tr -d ' \r\n' | base64 -d > projet/app/plaud.p12
            echo "SIGNATURE=stable" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore projet/app/plaud.p12 -storetype PKCS12 -storepass plaud-laurent -keypass plaud-laurent -alias plaud -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PLAUD Laurent provisoire"
            echo "SIGNATURE=provisoire" >> "$GITHUB_ENV"
            echo "::warning title=Signature provisoire::Secret PLAUD_KEYSTORE_B64 absent : APK de contrôle, non publié."
          fi
          keytool -list -keystore projet/app/plaud.p12 -storepass plaud-laurent -alias plaud > /dev/null && echo "Clé lisible." || { echo "::error title=Clé de signature::Le secret PLAUD_KEYSTORE_B64 est illisible : recopiez le fichier de clé en entier."; exit 1; }

      - name: Compiler l'APK
        shell: bash
        working-directory: projet
        env:
          VERSION_CODE: ${{ github.run_number }}
          PLAUD_KEY_PASSWORD: plaud-laurent
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Erreurs de compilation
        if: failure()
        shell: bash
        run: |
          E=$( { grep -E "error:|warning: \[" projet/build.log | head -25; grep -A 15 "What went wrong" projet/build.log | head -30; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
          echo "::error title=Compilation::$E"
          exit 1

      - name: Préparer l'APK
        shell: bash
        run: cp projet/app/build/outputs/apk/release/app-release.apk PLAUD-Laurent.apk

      - name: Publier l'APK
        if: env.SIGNATURE == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Numéro de version lu dans android/build.gradle (ex. « 1.4. ») : toujours à jour.
          V=$(sed -n "s/.*versionName '\([0-9.]*\)'.*/\1/p" android/build.gradle)${{ github.run_number }}
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "PLAUD Laurent — application Android" --notes "Application Android à installer sur le téléphone."
          gh release upload apk PLAUD-Laurent.apk --clobber
          gh release edit apk --notes "Version $V du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M'). Téléchargez PLAUD-Laurent.apk ci-dessous."
          echo "::notice::APK publié (version $V) : https://github.com/${{ github.repository }}/releases/download/apk/PLAUD-Laurent.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: PLAUD-Laurent.apk

  # Essai automatique sur un téléphone virtuel Android 14 : installation, ouverture,
  # démarrage d'un enregistrement. Les résultats s'affichent en notes dans l'exécution.
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Préparer le scénario de test
        run: |
          cat > "$RUNNER_TEMP/essai.sh" <<'EOF'
          P=fr.brasselet.plaud
          adb install -r -g PLAUD-Laurent.apk || echo "::error::Installation impossible"
          adb shell dumpsys deviceidle whitelist +$P
          adb logcat -c
          adb shell am start -n $P/.MainActivity --ez autotest true
          sleep 30
          adb shell dumpsys activity services $P > services.txt
          adb logcat -d > logcat.txt
          adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb shell cat /sdcard/ui.xml > ui.xml
          grep -E "PLAUD|AndroidRuntime" logcat.txt | tail -80
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          if grep -q "FATAL EXCEPTION" logcat.txt; then
            echo "::error title=Plantage::$(grep -A 25 'FATAL EXCEPTION' logcat.txt | head -40 | enc)"
          fi
          if grep -q "isForeground=true" services.txt; then S="actif au moment du contrôle"; else S="arrêté au moment du contrôle"; fi
          echo "::notice title=Service d'enregistrement::$S"
          echo "::notice title=Journal de l'application::$(grep ' PLAUD' logcat.txt | sed 's/.* PLAUD *: //' | head -60 | enc)"
          echo "::notice title=Écran::$(grep -o 'text="[^"]*"' ui.xml | sed 's/text="//;s/"$//' | grep -v '^$' | head -40 | enc)"
          # v1.5 — Whisper : l'application télécharge le modèle d'essai et transcrit une phrase d'exemple
          adb shell am force-stop $P
          adb logcat -c
          adb shell am start -n $P/.MainActivity --ez whisper_test true
          for i in $(seq 1 72); do sleep 5; adb logcat -d | grep -q "test whisper : fin" && break; done
          adb logcat -d > whisper.txt
          echo "::notice title=Test Whisper::$(grep ' PLAUD' whisper.txt | sed 's/.* PLAUD *: //' | grep -i -E 'whisper|modèle|téléchargement|parole' | head -30 | enc)"
          if grep -q -E "FATAL EXCEPTION|Fatal signal" whisper.txt; then
            echo "::error title=Plantage Whisper::$(grep -A 25 -E 'FATAL EXCEPTION|Fatal signal' whisper.txt | head -40 | enc)"
          fi
          grep -q "test whisper : code 0 " whisper.txt || echo "::error title=Test Whisper::La transcription d'essai n'a pas abouti (voir la note Test Whisper)."
          EOF

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash "$RUNNER_TEMP/essai.sh"
